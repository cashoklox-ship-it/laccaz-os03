name: Build Laccaz OS 0.5

on:
  workflow_dispatch:

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          unzip -q laccaz-os-0.5-appcenter.zip -d source
          test -f source/laccaz-os/auto/config
          test -f source/laccaz-os/scripts/build.sh

      - name: Build ISO in Debian 13
        run: |
          docker run --rm --privileged \
            -v "$PWD/source/laccaz-os:/work" \
            -w /work \
            debian:trixie \
            bash -c '
              apt-get update &&
              apt-get install -y live-build debootstrap debian-archive-keyring xorriso squashfs-tools dosfstools mtools syslinux-common isolinux grub-pc-bin grub-efi-amd64-bin ca-certificates &&
              bash scripts/build.sh
            '

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: laccaz-os-0.5-amd64
          path: |
            source/laccaz-os/artifacts/laccaz-os-0.5-amd64.iso
            source/laccaz-os/artifacts/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: source/laccaz-os/artifacts/*.log
          if-no-files-found: ignore
